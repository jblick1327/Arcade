<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#000000">
<title>Door</title>
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; color: #e4e8ed }
  body { display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; overflow-y: auto }
  main { width: 100%; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 8px 20px }
  canvas { display: block; background: #fff; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none }
  canvas:focus-visible { outline: 2px solid #dce4e6; outline-offset: 3px }
  .palette-controls { width: min(600px, 100%); border: 1px solid #394046; border-radius: 7px; background: #13171b }
  .palette-controls > summary { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 8px 14px; cursor: pointer; user-select: none; list-style: none; font: 500 13px/1.3 system-ui, sans-serif; letter-spacing: 0.02em }
  .palette-controls > summary::-webkit-details-marker { display: none }
  .palette-controls > summary:hover { background: #20262c }
  .palette-controls > summary:focus-visible { outline: 2px solid #e4e8ed; outline-offset: 2px }
  .palette-current { margin-left: auto; width: 18px; height: 18px; border: 1px solid #e4e8ed80; border-radius: 3px }
  .palette-chevron { width: 8px; height: 8px; border-right: 1.5px solid #cad1d8; border-bottom: 1.5px solid #cad1d8; transform: rotate(45deg); transition: transform 150ms ease; margin: -4px 1px 0 4px }
  .palette-controls[open] .palette-chevron { transform: rotate(225deg); margin-top: 4px }
  .palette-picker { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 14px; border-top: 1px solid #30363c }
  .palette-row { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px }
  .palette-swatch { display: block; width: 100%; aspect-ratio: 1; padding: 0; border: 1px solid #ffffff55; border-radius: 3px; cursor: pointer; touch-action: manipulation }
  .palette-swatch:hover { border-color: #fff }
  .palette-swatch[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 2px }
  .palette-swatch:focus-visible { outline: 2px solid #fff; outline-offset: 2px }
  .palette-divider { height: 1px; background: #67707988; margin: 2px 0 }
  @media (max-width: 560px) {
    .palette-row { grid-template-columns: repeat(8, minmax(0, 1fr)) }
    .palette-picker { padding: 12px 12px 14px }
  }
  @media (prefers-reduced-motion: reduce) { .palette-chevron { transition: none } }
</style>
<main>
  <canvas id="screen" width="160" height="144" tabindex="0" aria-label="Door. Press A, Z, or Space, or tap the screen to open the door."></canvas>
  <details id="palette-controls" class="palette-controls">
    <summary><span>Palettes</span><span id="palette-current" class="palette-current" aria-hidden="true"></span><span class="palette-chevron" aria-hidden="true"></span></summary>
    <div id="palettes"></div>
  </details>
</main>
<script src="visual-data.js"></script>
<script src="audio-data.js"></script>
<script src="audio.js"></script>
<script src="palettes.js"></script>
<script src="/sdk/arcade.js"></script>
<script src="arcade.js"></script>
<script src="game.js"></script>
</html>
